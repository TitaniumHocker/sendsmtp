name: Release

on:
  push:
    tags: ['[0-9]*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Verify tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "$version" ] || { echo "tag $TAG != pyproject version $version" >&2; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
