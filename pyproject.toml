[project]
name = "sendsmtp"
version = "2.0.0"
description = "CLI SMTP client in pure Python"
authors = [{ name = "Ivan Fedorov", email = "inbox@titaniumhocker.ru" }]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["smtp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Email Clients (MUA)",
]

[project.urls]
Homepage = "https://github.com/TitaniumHocker/sendsmtp"
"Bug Tracker" = "https://github.com/TitaniumHocker/sendsmtp/issues"

[project.scripts]
sendsmtp = "sendsmtp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/sendsmtp"]

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-class-attributes = false
check-return-types = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pydoclint>=0.9.1",
    "ruff>=0.16.6",
]
